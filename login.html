<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f172a, #2563eb);
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    .login-box {
        background: white;
        width: 100%;
        max-width: 380px;
        padding: 30px;
        border-radius: 18px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .login-box h1 {
        color: #2563eb;
        font-size: 35px;
        margin-bottom: 10px;
    }

    .login-box h2 {
        color: #222;
        margin-bottom: 25px;
    }

    .login-box input {
        width: 100%;
        padding: 13px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
    }

    .login-box input:focus {
        border-color: #2563eb;
    }

    .login-box button {
        width: 100%;
        padding: 13px;
        margin-top: 15px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 17px;
    }

    .login-box button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    #message {
        margin-top: 15px;
        font-size: 14px;
        overflow-wrap: anywhere;
    }

    .back-link {
        display: inline-block;
        margin-top: 15px;
        color: #2563eb;
        text-decoration: none;
    }
</style>
```

</head>

<body>

<div class="login-box">

```
<h1>MEDO</h1>

<h2>تسجيل الدخول 🔐</h2>

<input
    type="email"
    id="email"
    placeholder="البريد الإلكتروني"
>

<input
    type="password"
    id="password"
    placeholder="كلمة المرور"
>

<button id="loginBtn">دخول</button>

<p id="message"></p>

<a href="index.html" class="back-link">
    العودة للموقع الرئيسي
</a>

<br>

<a href="register.html" class="back-link">
    إنشاء حساب جديد 📝
</a>
```

</div>

<script type="module">

    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://yfktbkqerjvhgopnoowj.supabase.co';

    const SUPABASE_KEY = 'sb_publishable_DnWZ6SjWDdwZ3eNWL3MQAA_cY4CJ0mI';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const button = document.getElementById('loginBtn');
    const message = document.getElementById('message');

    button.addEventListener('click', login);

    async function login() {

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
            showMessage('اكتب البريد الإلكتروني وكلمة المرور', 'red');
            return;
        }

        button.disabled = true;
        button.textContent = 'جاري تسجيل الدخول...';

        try {

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                showMessage('خطأ: ' + error.message, 'red');
                return;
            }

            showMessage('أهلاً بيك! جاري الدخول...', 'green');

            setTimeout(function() {
                window.location.href = 'index.html';
            }, 1000);

        } catch (error) {
            showMessage('تعذر الاتصال: ' + error.message, 'red');
        } finally {
            button.disabled = false;
            button.textContent = 'دخول';
        }
    }

    function showMessage(text, color) {
        message.style.color = color;
        message.textContent = text;
    }

</script>

</body>
</html>
