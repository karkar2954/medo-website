<style>

<body>

<div class="register-box">

```
<h1>MEDO</h1>
<h2>إنشاء حساب جديد 📝</h2>

<input type="text" id="newUsername" placeholder="اسم المستخدم">

<input type="email" id="newEmail" placeholder="البريد الإلكتروني">

<input type="password" id="newPassword" placeholder="كلمة المرور">

<input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور">

<button id="registerBtn">إنشاء الحساب</button>

<p id="message"></p>

<a href="login.html">عندي حساب بالفعل؟ تسجيل الدخول</a>
```

</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://yfktbkqerjvhgopnoowj.supabase.co';

    const SUPABASE_KEY = 'sb_publishable_DnWZ6SjWDdwZ3eNWL3MQAA_cY4CJ0mI';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const button = document.getElementById('registerBtn');
    const message = document.getElementById('message');

    button.addEventListener('click', register);

    async function register() {
        const username = document.getElementById('newUsername').value.trim();
        const email = document.getElementById('newEmail').value.trim();
        const password = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!username || !email || !password || !confirmPassword) {
            showMessage('من فضلك املأ كل الخانات', 'red');
            return;
        }

        if (password.length < 6) {
            showMessage('كلمة المرور لازم تكون 6 أحرف على الأقل', 'red');
            return;
        }

        if (password !== confirmPassword) {
            showMessage('كلمتا المرور غير متطابقتين', 'red');
            return;
        }

        button.disabled = true;
        button.textContent = 'جاري إنشاء الحساب...';

        try {
            const { error } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        username: username
                    },
                    emailRedirectTo: 'https://karkar2954.github.io/medo-website/'
                }
            });

            if (error) {
                showMessage('حدث خطأ: ' + error.message, 'red');
                return;
            }

            showMessage(
                'تم إنشاء الحساب! افتح بريدك الإلكتروني واضغط رابط التأكيد.',
                'green'
            );

        } catch (error) {
            showMessage('تعذر الاتصال: ' + error.message, 'red');
        } finally {
            button.disabled = false;
            button.textContent = 'إنشاء الحساب';
        }
    }

    function showMessage(text, color) {
        message.style.color = color;
        message.textContent = text;
    }
</script>

</body>
</html>
